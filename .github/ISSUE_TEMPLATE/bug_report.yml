name: Bug report / 问题反馈
description: Report unexpected behavior / 反馈异常行为
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior / 复现步骤与预期
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, browser and Node version / 系统、浏览器和 Node 版本
  - type: textarea
    id: details
    attributes:
      label: Details / 补充信息
      description: Use fictional examples. Remove private data from screenshots and files.
